<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Simulador 3D de Magnetismo</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <aside>
    <h1>Simulador 3D de Magnetismo</h1>
    <div id="tabs"></div>
    <div id="ctrls"></div>
    <div class="btns">
      <button id="rs">Reiniciar</button>
      <button id="pz">Pausar</button>
    </div>
    <h2>Lecturas en vivo</h2>
    <div id="ro"></div>
    <h2>Teoría</h2>
    <p id="th"></p>
    <p class="mu">
      Ejes: X rojo, Y verde (vertical), Z azul. Arrastra para rotar, rueda para zoom, clic derecho para desplazar. Unidades: SI.
    </p>
  </aside>
  <div id="cvw"></div>

  <!-- Librerías Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- Núcleo del simulador -->
  <script src="js/core/constants.js"></script>
  <script src="js/core/scene.js"></script>
  <script src="js/core/ui.js"></script>

  <!-- Módulos de simulación -->
  <script src="js/modules/mod1-lorentz.js"></script>
  <script src="js/modules/mod2-biot-savart.js"></script>

  <!-- Punto de entrada -->
  <script src="js/main.js"></script>
</body>
</html>
